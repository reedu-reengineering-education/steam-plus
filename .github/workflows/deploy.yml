name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Rebuild periodically so CMS content changes (no ISR on static export) go live.
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn

      # Next.js 12's native SWC binary needs libssl.so.1.1, which modern
      # ubuntu-latest runners (OpenSSL 3) no longer ship. Its WASM fallback
      # is also broken on Next 12.2.x (malformed registry URL), so install
      # the lib directly instead of relying on either.
      - name: Install libssl1.1 (Next.js 12 SWC dependency)
        run: |
          curl -sSLo /tmp/libssl1.1.deb http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_DIRECTUS_URL: ${{ secrets.NEXT_PUBLIC_DIRECTUS_URL }}
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_PARTNER: ${{ secrets.KALTURA_PARTNER }}
          KALTURA_UI_CONF_ID: ${{ secrets.KALTURA_UI_CONF_ID }}
        run: |
          yarn build
          yarn export

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
